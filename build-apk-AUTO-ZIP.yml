name: Build FutureGameBooster FINAL READY

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and validate Android project ZIP
        shell: bash
        run: |
          set -e

          ZIP="$(find . -maxdepth 1 -type f -name 'FutureGameBooster*.zip' -print | head -n 1)"

          if [ -z "$ZIP" ]; then
            echo "ERROR: Tidak ada ZIP FutureGameBooster*.zip di root repository."
            ls -la
            exit 1
          fi

          echo "ZIP ditemukan: $ZIP"

          if ! unzip -t "$ZIP" >/dev/null; then
            echo "ERROR: ZIP rusak/tidak valid: $ZIP"
            exit 1
          fi

          echo "ZIP valid."

      - name: Extract Android project
        shell: bash
        run: |
          set -e

          ZIP="$(find . -maxdepth 1 -type f -name 'FutureGameBooster*.zip' -print | head -n 1)"

          rm -rf extracted
          mkdir extracted
          unzip -q "$ZIP" -d extracted

          # If the ZIP contains one top-level folder, enter it automatically.
          if [ -f extracted/settings.gradle.kts ]; then
            cp -a extracted/. .
          else
            ROOT="$(find extracted -mindepth 1 -maxdepth 1 -type d | head -n 1)"
            if [ -n "$ROOT" ] && [ -f "$ROOT/settings.gradle.kts" ]; then
              cp -a "$ROOT"/. .
            else
              echo "ERROR: settings.gradle.kts tidak ditemukan di dalam ZIP."
              find extracted -maxdepth 3 -type f | head -100
              exit 1
            fi
          fi

          rm -rf extracted

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.11.1 --distribution-type bin

      - name: Verify Android project
        run: |
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          echo "Android project OK"

      - name: Build APK
        run: ./gradlew clean assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FutureGameBooster-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
