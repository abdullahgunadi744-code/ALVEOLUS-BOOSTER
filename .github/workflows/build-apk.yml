name: Build FutureGameBooster FINAL MEDIA

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find FINAL MEDIA ZIP
        run: |
          set -e

          ZIP="./FutureGameBooster_FINAL_FIXED_MEDIA.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: ZIP tidak ditemukan:"
            ls -la
            exit 1
          fi

          echo "ZIP ditemukan: $ZIP"

      - name: Extract Android project
        run: |
          set -e

          rm -rf extracted
          mkdir extracted

          unzip -q "./FutureGameBooster_FINAL_FIXED_MEDIA.zip" -d extracted

          cp -a extracted/. .
          rm -rf extracted

          echo "=== PROJECT ==="
          ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle Wrapper
        run: |
          gradle wrapper \
            --gradle-version 8.11.1 \
            --distribution-type bin

      - name: Verify Android project
        run: |
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

          echo "Android project OK"

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FutureGameBooster-FINAL-MEDIA-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
