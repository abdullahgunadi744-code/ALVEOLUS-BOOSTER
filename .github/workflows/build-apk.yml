name: Build FutureGameBooster FINAL READY

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find FINAL READY ZIP
        shell: bash
        run: |
          set -e
          ZIP="./FutureGameBooster_FINAL_READY.zip"
          if [ ! -f "$ZIP" ]; then
            echo "ERROR: $ZIP tidak ditemukan."
            echo "ZIP yang tersedia:"
            find . -maxdepth 1 -type f -name '*.zip' -print
            exit 1
          fi
          echo "ZIP ditemukan: $ZIP"

      - name: Extract Android project
        shell: bash
        run: |
          set -e
          rm -rf extracted
          mkdir extracted
          unzip -q "./FutureGameBooster_FINAL_READY.zip" -d extracted
          cp -a extracted/. .
          rm -rf extracted

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.11.1 --distribution-type bin

      - name: Verify Android project
        run: |
          set -e
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/futuregamebooster/boosterai/MainActivity.kt
          test -f app/src/main/java/com/futuregamebooster/boosterai/OverlayService.kt
          echo "Android project OK"

      - name: Build APK
        run: ./gradlew clean assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FutureGameBooster-FINAL-READY-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
