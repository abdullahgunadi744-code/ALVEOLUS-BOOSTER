name: Build FutureGameBooster

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: ZIP project tidak ditemukan"
            ls -la
            exit 1
          fi

          echo "ZIP ditemukan: $ZIP"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Extract Android project
        run: |
          set -e

          rm -rf extracted android-project
          mkdir extracted android-project

          echo "Testing ZIP..."
          unzip -t "$ZIP"

          echo "Extract ZIP..."
          unzip -q "$ZIP" -d extracted

          PROJECT_DIR=$(find extracted -type f \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            -print -quit | xargs dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle tidak ditemukan di dalam ZIP"
            find extracted -maxdepth 4 -type f | head -100
            exit 1
          fi

          echo "Android project ditemukan di: $PROJECT_DIR"
          cp -a "$PROJECT_DIR"/. android-project/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle Wrapper
        working-directory: android-project
        run: |
          gradle wrapper \
            --gradle-version 8.11.1 \
            --distribution-type bin

      - name: Verify Android project
        working-directory: android-project
        run: |
          set -e

          test -f settings.gradle.kts || test -f settings.gradle
          test -f app/build.gradle.kts || test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml

          echo "Android project OK"

      - name: Build APK
        working-directory: android-project
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FutureGameBooster-APK
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
