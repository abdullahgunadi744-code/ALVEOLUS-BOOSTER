name: Build FutureGameBooster APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare exact project ZIP
        shell: bash
        run: |
          set -e
          ZIP="./FutureGameBooster_BoosterAI_v3.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: $ZIP tidak ditemukan."
            echo "ZIP yang ada di root:"
            find . -maxdepth 1 -type f -name "*.zip" -print
            exit 1
          fi

          # Bersihkan project Android lama agar tidak tercampur.
          rm -rf app
          rm -f settings.gradle settings.gradle.kts build.gradle build.gradle.kts gradle.properties
          rm -rf gradle

          mkdir project
          unzip -q "$ZIP" -d project

          # Pastikan isi ZIP memang project yang diharapkan.
          test -f project/settings.gradle.kts
          test -f project/app/build.gradle.kts
          test -f project/app/src/main/AndroidManifest.xml

          cp -a project/. .
          rm -rf project

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle wrapper 8.11.1
        run: gradle wrapper --gradle-version 8.11.1 --distribution-type bin

      - name: Verify project
        run: |
          echo "=== settings.gradle.kts ==="
          sed -n '1,120p' settings.gradle.kts
          echo "=== app/build.gradle.kts ==="
          sed -n '1,160p' app/build.gradle.kts
          echo "=== MainActivity.kt ==="
          sed -n '1,260p' app/src/main/java/com/futuregamebooster/boosterai/MainActivity.kt

      - name: Build APK
        run: ./gradlew clean assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FutureGameBooster-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
